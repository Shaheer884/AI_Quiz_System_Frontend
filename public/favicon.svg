<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Page Shading Gradients -->
    <linearGradient id="leftPageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="rightPageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="goldRibbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect width="64" height="64" rx="15" fill="url(#brandGrad)"/>

  <!-- Subtle Top Highlight / Gloss -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" stroke="white" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>

  <!-- Book Illustration -->
  <g filter="url(#cardShadow)">
    <!-- Book Outer Cover / Thickness Underneath -->
    <path d="M10 44.5 C18 41 27 41.5 32 45 C37 41.5 46 41 54 44.5 V48 C46 44.5 37 45 32 48.5 C27 45 18 44.5 10 48 Z" fill="#1e1b4b" opacity="0.9"/>

    <!-- Left Open Page -->
    <path d="M10 42 C18 38.5 27 39 32 42.5 V21.5 C27 18 18 17.5 10 21 Z" fill="url(#leftPageGrad)"/>

    <!-- Right Open Page -->
    <path d="M54 42 C46 38.5 37 39 32 42.5 V21.5 C37 18 46 17.5 54 21 Z" fill="url(#rightPageGrad)"/>

    <!-- Book Center Fold / Spine -->
    <line x1="32" y1="21.5" x2="32" y2="43.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Question / Content Lines (Left Page) -->
    <line x1="14" y1="25.5" x2="27" y2="26.8" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="30.5" x2="27" y2="31.8" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="35.5" x2="24" y2="36.8" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Question / Content Lines (Right Page) -->
    <line x1="37" y1="26.8" x2="50" y2="25.5" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="37" y1="31.8" x2="50" y2="30.5" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="37" y1="36.8" x2="47" y2="35.5" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Golden Bookmark Ribbon Hanging Down -->
    <path d="M30 18 H34 V32 L32 30 L30 32 Z" fill="url(#goldRibbon)"/>

    <!-- Quiz Star / Knowledge Spark floating above the book -->
    <path d="M32 8 L33.4 12.2 L37.5 13.5 L33.4 14.8 L32 19 L30.6 14.8 L26.5 13.5 L30.6 12.2 Z" fill="#fbbf24"/>
    <circle cx="32" cy="13.5" r="1.5" fill="#ffffff"/>
  </g>
</svg>